# Builds the desktop app for Windows (x64 installer) and macOS (Apple Silicon .dmg).
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag v*. Artifacts are attached to the run.
#
# Signing: builds are unsigned unless secrets are configured. macOS gets an ad-hoc signature so it runs on Apple
# Silicon; downloaded copies then need "Open Anyway" in System Settings > Privacy & Security once. For a notarised
# build add CSC_LINK / CSC_KEY_PASSWORD (Developer ID .p12) and APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            builder: --win --x64
          - os: macos-15
            builder: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Backend (PyInstaller)
        run: pyinstaller packaging/backend.spec --noconfirm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop app
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run build
          # an empty CSC_LINK (secret not configured) makes electron-builder look for a certificate file: unset it
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # no Developer ID certificate configured: ad-hoc sign on macOS (required to run on Apple Silicon)
          npx electron-builder ${{ matrix.builder }} ${{ runner.os == 'macOS' && secrets.CSC_LINK == '' && '-c.mac.identity=-' || '' }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: astroflow-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error
